<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جواز سفر جورجيا — خط سير الرحلة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<style>
:root{
  --wine:#6B1E2B;
  --wine-dark:#3E1119;
  --wine-soft:#8C3145;
  --cream:#F2EAD9;
  --paper:#FBF7EF;
  --ink:#2B2420;
  --ink-soft:#6b6157;
  --teal:#2F6E6A;
  --gold:#C79A3D;
  --gold-light:#E4C88B;
  --line:#E1D5BC;
  --radius:16px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Cairo',sans-serif;}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}

/* ===== Header / Passport cover ===== */
.cover{
  background:
    radial-gradient(circle at 15% 20%, rgba(196,155,61,.18), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(196,155,61,.12), transparent 45%),
    linear-gradient(160deg,var(--wine) 0%,var(--wine-dark) 100%);
  color:var(--gold-light);
  padding:34px 20px 26px;
  text-align:center;
  border-bottom:6px solid var(--gold);
  position:relative;
  overflow:hidden;
}
.cover .emblem{
  width:56px;height:56px;margin:0 auto 10px;
  border:2px solid var(--gold);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
}
.cover h1{
  margin:0 0 6px;
  font-size:clamp(24px,5vw,34px);
  font-weight:900;
  letter-spacing:.5px;
  color:#fff;
}
.cover p.sub{margin:0;color:var(--gold-light);font-size:14px;opacity:.9}
.cover .stamps-count{
  margin-top:18px;
  display:inline-flex;
  align-items:center;
  gap:10px;
  background:rgba(0,0,0,.18);
  border:1px solid rgba(196,155,61,.45);
  padding:8px 18px;
  border-radius:999px;
  font-family:'Cairo',sans-serif;
  font-weight:700;
  font-size:14px;
}
.cover .stamps-count b{font-size:18px;color:var(--gold)}

/* ===== Tabs ===== */
.tabs{
  display:flex;
  gap:8px;
  padding:14px 12px;
  max-width:980px;
  margin:0 auto;
  flex-wrap:wrap;
  justify-content:center;
}
.tab-btn{
  border:2px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  padding:10px 16px;
  border-radius:999px;
  font-weight:700;
  font-family:'Cairo',sans-serif;
  font-size:14px;
  display:flex;align-items:center;gap:8px;
  transition:.2s;
}
.tab-btn .ring{
  width:22px;height:22px;border-radius:50%;
  background:conic-gradient(var(--teal) calc(var(--p,0)*1%), var(--line) 0);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:800;color:var(--ink);
}
.tab-btn .ring::after{
  content:"";width:15px;height:15px;border-radius:50%;background:var(--paper);
}
.tab-btn.active{
  background:var(--wine);
  border-color:var(--wine);
  color:#fff;
}
.tab-btn.active .ring::after{background:var(--wine);}

/* ===== Main ===== */
main{max-width:980px;margin:0 auto;padding:0 14px 60px;}
.city-section{display:none;}
.city-section.active{display:block;animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.city-head{
  display:flex;justify-content:space-between;align-items:flex-end;
  gap:12px;flex-wrap:wrap;
  margin:22px 0 12px;
}
.city-head h2{font-size:24px;margin:0;color:var(--wine-dark);}
.city-head .meta{font-size:13px;color:var(--ink-soft)}
.progress-wrap{flex:1;min-width:180px;}
.progress-bar{
  height:9px;background:var(--line);border-radius:99px;overflow:hidden;
}
.progress-bar > span{
  display:block;height:100%;background:linear-gradient(90deg,var(--teal),#3f8f8a);
  border-radius:99px;transition:width .4s ease;
}
.progress-label{font-size:12px;color:var(--ink-soft);margin-top:4px;}

.controls{display:flex;gap:8px;margin:6px 0 14px;flex-wrap:wrap;}
.view-toggle{
  display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;
}
.view-toggle button{
  border:none;background:var(--paper);padding:8px 14px;font-size:13px;font-weight:700;
  font-family:'Cairo',sans-serif;color:var(--ink-soft);
}
.view-toggle button.active{background:var(--teal);color:#fff;}
.reset-btn{
  border:1px solid var(--wine-soft);background:transparent;color:var(--wine-soft);
  padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;font-family:'Cairo',sans-serif;
}
.reset-btn:hover{background:var(--wine-soft);color:#fff;}

.map{
  height:280px;border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--line);margin-bottom:18px;
  box-shadow:0 2px 10px rgba(43,36,32,.08);
}

.day-header{
  font-family:'Cairo',sans-serif;font-weight:800;color:var(--wine);
  font-size:15px;margin:20px 0 10px;
  display:flex;align-items:center;gap:10px;
}
.day-header::after{content:"";flex:1;height:1px;background:var(--line);}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:14px;
}

.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  position:relative;
  transition:.2s;
  display:flex;flex-direction:column;
}
.card.visited{border-color:var(--gold);box-shadow:0 0 0 2px rgba(199,154,61,.35);}
.card .thumb{
  height:150px;background:linear-gradient(135deg,#d8cbb0,#c3b291);
  position:relative;display:flex;align-items:center;justify-content:center;
  color:#7a6b4f;font-size:26px;overflow:hidden;
}
.card .thumb .illustration{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.card .thumb .gallery{
  position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.card .thumb .gallery::-webkit-scrollbar{display:none;}
.card .thumb .gallery img{
  flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;
}
.g-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:50%;border:none;
  background:rgba(43,36,32,.45);color:#fff;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  opacity:0;transition:opacity .2s;z-index:2;
}
.card .thumb:hover .g-nav{opacity:1;}
.g-prev{right:6px;} .g-next{left:6px;}
.g-dots{
  position:absolute;bottom:6px;left:0;right:0;
  display:flex;justify-content:center;gap:4px;z-index:2;
}
.g-dots span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 2px rgba(0,0,0,.5);}
.g-video{
  position:absolute;top:8px;left:8px;z-index:2;
  width:28px;height:28px;border-radius:50%;background:rgba(43,36,32,.55);
  display:flex;align-items:center;justify-content:center;font-size:13px;
  text-decoration:none;
}
.card .body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:6px;flex:1;}
.card h3{margin:0;font-size:15px;line-height:1.4;}
.card p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.6;flex:1;}
.card .row{display:flex;align-items:center;justify-content:space-between;margin-top:4px;gap:8px;}
.card .loc-link{
  font-size:11.5px;color:var(--teal);text-decoration:none;font-weight:700;
  display:inline-flex;align-items:center;gap:4px;
}
.focus-map-btn{
  font-size:11.5px;color:var(--wine);background:rgba(107,30,43,.08);
  border:1px solid rgba(107,30,43,.25);border-radius:8px;
  padding:4px 8px;font-weight:700;font-family:'Tajawal',sans-serif;
  display:inline-flex;align-items:center;gap:4px;
}
.focus-map-btn:hover{background:rgba(107,30,43,.16);}
.card .row{flex-wrap:wrap;}
@keyframes flashCard{
  0%,100%{box-shadow:0 0 0 2px transparent;}
  25%,75%{box-shadow:0 0 0 3px var(--gold);}
}
.card.flash{animation:flashCard 1.4s ease;}
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
.title-row h3{flex:1;}
.act-chip{
  flex-shrink:0;font-size:10.5px;font-weight:800;font-family:'Cairo',sans-serif;
  color:var(--teal);background:rgba(47,110,106,.12);
  border:1px solid rgba(47,110,106,.3);border-radius:999px;
  padding:3px 9px;white-space:nowrap;
}
.card{cursor:default;}
.card.activities-open .act-chip{background:var(--teal);color:#fff;}
.activities-panel{
  display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease;
}
.activities-inner{overflow:hidden;min-height:0;}
.card.activities-open .activities-panel{grid-template-rows:1fr;}
.activity{
  background:rgba(47,110,106,.07);border:1px solid rgba(47,110,106,.2);
  border-radius:10px;padding:8px 10px;margin-top:6px;
}
.activity-head{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.a-icon{font-size:14px;}
.a-title{font-family:'Cairo',sans-serif;font-weight:800;font-size:12.5px;color:var(--wine-dark);}
.a-desc{margin:0 0 5px;font-size:11.5px;color:var(--ink-soft);line-height:1.6;}
.a-meta{display:flex;flex-wrap:wrap;gap:5px;}
.a-badge{
  font-size:10px;font-weight:700;color:var(--teal);
  background:rgba(255,255,255,.7);border:1px solid rgba(47,110,106,.25);
  border-radius:6px;padding:2px 6px;
}
.check-label{
  display:flex;align-items:center;gap:6px;cursor:pointer;
  font-size:12px;font-weight:700;color:var(--ink-soft);
  font-family:'Cairo',sans-serif;
}
.check-label input{width:17px;height:17px;accent-color:var(--teal);cursor:pointer;}

/* Passport stamp signature element */
.stamp{
  position:absolute;top:8px;left:8px;
  width:60px;height:60px;border-radius:50%;
  border:2.5px dashed var(--wine);
  color:var(--wine);
  display:flex;align-items:center;justify-content:center;
  font-family:'Cairo',sans-serif;font-weight:900;font-size:10px;text-align:center;
  transform:rotate(-16deg) scale(0);
  background:rgba(255,255,255,.75);
  opacity:0;
  pointer-events:none;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .25s;
}
.card.visited .stamp{transform:rotate(-16deg) scale(1);opacity:1;}
.stamp span{display:block;line-height:1.15;}

footer{
  text-align:center;padding:26px 14px 40px;color:var(--ink-soft);font-size:12px;
}

@media (max-width:520px){
  .map{height:220px;}
}
</style>
</head>

let visited = {};
try{ visited = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }catch(e){ visited = {}; }
function saveVisited(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(visited)); }catch(e){} }

const viewMode = {}; // cityId -> 'day' | 'list'
CITIES.forEach(c=>viewMode[c.id]='day');

const mapInstances = {};
const mapBounds = {};

const cardRefs = {}; // landmarkId -> card DOM element
let activeCity = CITIES[0].id;

/* ================= RENDER SHELL ================= */
const tabsEl = document.getElementById('tabs');
const mainEl = document.getElementById('main');

function totalLandmarks(){ return CITIES.reduce((s,c)=>s+c.landmarks.length,0); }
function visitedCountOf(city){ return city.landmarks.filter(l=>visited[l.id]).length; }
function totalVisited(){ return CITIES.reduce((s,c)=>s+visitedCountOf(c),0); }

function scrollToActive(){
  const sec = document.getElementById('sec-'+activeCity);
  if(sec) sec.scrollIntoView({behavior:'smooth', block:'start'});
}

function buildSections(){
  mainEl.innerHTML = CITIES.map(c=>`
    <section class="city-section ${c.id===activeCity?'active':''}" id="sec-${c.id}">
      <div class="city-head">
        <div>
          <h2>${c.name}</h2>
          <div class="meta">${c.landmarks.length} معلمًا سياحيًا · إقامة ${c.days} ${c.days>1?'أيام':'يوم'}</div>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar"><span id="bar-${c.id}" style="width:0%"></span></div>

        </div>
      </div>
      <div class="controls">
        <div class="view-toggle">
          <button data-mode="day" data-city="${c.id}">حسب الأيام</button>

        </div>

      </div>
      <div class="map" id="map-${c.id}"></div>

  mainEl.querySelectorAll('.view-toggle button').forEach(btn=>{

    });

  mainEl.querySelectorAll('[data-reset]').forEach(btn=>{

      city.landmarks.forEach(l=>{ delete visited[l.id]; refreshMarkerIcon(l.id); });
      saveVisited();
      renderCards(city);
      updateToggleButtons(cityId);
      updateProgress(city);
      buildTabs();
      updateHeaderStamps();
    });
  });
}

function updateToggleButtons(cityId){
  document.querySelectorAll(`.view-toggle button[data-city="${cityId}"]`).forEach(b=>{

  });
}

/* ================= MAP ================= */
function ensureMap(city){
  if(mapInstances[city.id]) return mapInstances[city.id];
  const map = L.map('map-'+city.id, {scrollWheelZoom:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap contributors', maxZoom:18
  }).addTo(map);

  const ordered = [...city.landmarks].sort((a,b)=> a.day-b.day || a.id.localeCompare(b.id));
  const latlngs = [];
  ordered.forEach((l,idx)=>{
    const icon = L.divIcon({
      className:'', html:`<div style="background:${visited[l.id]?'#C79A3D':'#6B1E2B'};color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Cairo,sans-serif;font-weight:800;font-size:12px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)">${idx+1}</div>`,
      iconSize:[26,26], iconAnchor:[13,13]
    });
    const marker = L.marker([l.lat,l.lng], {icon}).addTo(map)
      .bindPopup(`<b>${l.name}</b><br>اليوم ${l.day}`);
    marker.on('click', ()=> focusCard(l.id));
    markerRefs[l.id] = {marker, city};
    latlngs.push([l.lat,l.lng]);
  });
  L.polyline(latlngs, {color:'#2F6E6A', weight:2, dashArray:'6,6', opacity:.7}).addTo(map);
  const bounds = L.latLngBounds(latlngs);
  map.fitBounds(bounds, {padding:[28,28]});
  mapInstances[city.id] = map;
  mapBounds[city.id] = bounds;
  return map;
}

function refreshMarkerIcon(landmarkId){
  const ref = markerRefs[landmarkId];
  if(!ref) return;
  const ordered = [...ref.city.landmarks].sort((a,b)=> a.day-b.day || a.id.localeCompare(b.id));
  const idx = ordered.findIndex(l=>l.id===landmarkId);
  const l = ref.city.landmarks.find(x=>x.id===landmarkId);
  const icon = L.divIcon({
    className:'', html:`<div style="background:${visited[landmarkId]?'#C79A3D':'#6B1E2B'};color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Cairo,sans-serif;font-weight:800;font-size:12px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)">${idx+1}</div>`,
    iconSize:[26,26], iconAnchor:[13,13]
  });
  ref.marker.setIcon(icon);
}

/* Map ↔ card linking: clicking a marker jumps to its card, and vice versa. */
function focusCard(landmarkId){
  const card = cardRefs[landmarkId];
  if(!card) return;
  card.scrollIntoView({behavior:'smooth', block:'center'});
  card.classList.add('flash');
  setTimeout(()=> card.classList.remove('flash'), 1400);
}
function focusMarker(landmarkId){
  const ref = markerRefs[landmarkId];
  if(!ref) return;
  const map = mapInstances[ref.city.id];
  if(!map) return;
  document.getElementById('map-'+ref.city.id).scrollIntoView({behavior:'smooth', block:'center'});
  map.setView(ref.marker.getLatLng(), Math.max(map.getZoom(), 15), {animate:true});
  setTimeout(()=> ref.marker.openPopup(), 400);
}

function renderThumb(thumbEl, land){
  thumbEl.innerHTML = `<div class="illustration">${CATEGORY_SVG[land.cat] || CATEGORY_SVG.city}</div>`;
  const imgs = (land.images || []).filter(Boolean);
  if(!imgs.length) return;
  const gallery = document.createElement('div');
  gallery.className = 'gallery';
  imgs.forEach((src, i)=>{
    const img = document.createElement('img');
    img.src = src;
    img.alt = land.name + ' - ' + (i+1);
    img.loading = 'lazy';
    img.onerror = function(){ img.remove(); updateDots(); };
    gallery.appendChild(img);
  });
  thumbEl.appendChild(gallery);
  if(imgs.length > 1){
    const prev = document.createElement('button');
    prev.type='button'; prev.className='g-nav g-prev'; prev.innerHTML='‹';
    const isRtl = document.documentElement.dir === 'rtl';
    prev.onclick = ()=> gallery.scrollBy({left: gallery.clientWidth * (isRtl?1:-1), behavior:'smooth'});
    const next = document.createElement('button');
    next.type='button'; next.className='g-nav g-next'; next.innerHTML='›';
    next.onclick = ()=> gallery.scrollBy({left: gallery.clientWidth * (isRtl?-1:1), behavior:'smooth'});
    thumbEl.appendChild(prev); thumbEl.appendChild(next);
    const dots = document.createElement('div');
    dots.className = 'g-dots';
    imgs.forEach(()=> dots.appendChild(document.createElement('span')));
    thumbEl.appendChild(dots);
    function updateDots(){
      const remaining = gallery.querySelectorAll('img').length;
      dots.querySelectorAll('span').forEach((d,i)=> d.style.display = i < remaining ? '' : 'none');
    }
  }
  if(land.video){
    const vid = document.createElement('a');
    vid.className = 'g-video'; vid.href = land.video; vid.target='_blank'; vid.rel='noopener';
    vid.title = 'مشاهدة فيديو'; vid.textContent = '🎥';
    thumbEl.appendChild(vid);
  }
}

/* ================= CARDS ================= */
function renderCards(city){
  const grid = document.getElementById('grid-'+city.id);
  grid.innerHTML = '';

  if(viewMode[city.id]==='day'){
    const dayNums = [...new Set(city.landmarks.map(l=>l.day))].sort((a,b)=>a-b);
    dayNums.forEach(d=>{
      const header = document.createElement('div');
      header.className = 'day-header';
      header.style.gridColumn = '1/-1';
      header.textContent = 'اليوم ' + d;
      grid.appendChild(header);
      const sub = document.createElement('div');
      sub.className = 'grid';
      sub.style.gridColumn = '1/-1';
      grid.appendChild(sub);
      city.landmarks.filter(l=>l.day===d).forEach(l=>{
        const before = grid.children.length;
        buildCardInto(sub, l, city);
      });
    });
  } else {
    city.landmarks.forEach(l=> buildCardInto(grid, l, city));
  }

  function buildCardInto(container, l, city){
    const wrap = document.createElement('div');
    wrap.className = 'card' + (visited[l.id]?' visited':'');
    wrap.id = 'card-'+l.id+'-'+container.id||'';
    const hasActivities = l.activities && l.activities.length;
    wrap.innerHTML = `
      <div class="thumb" id="thumb-${l.id}-${Math.random().toString(36).slice(2,7)}">🏞️</div>
      <div class="stamp"><span>تمت<br>الزيارة<br>✓</span></div>
      <div class="body">
        <div class="title-row">
          <h3>${l.name}</h3>
          ${hasActivities ? `<button type="button" class="act-chip" data-id="${l.id}">🎯 ${l.activities.length} ${l.activities.length>1?'أنشطة':'نشاط'}</button>` : ''}
        </div>
        <p>${l.desc}</p>
        ${hasActivities ? `<div class="activities-panel" id="panel-${l.id}"><div class="activities-inner">${l.activities.map(a=>`
          <div class="activity">
            <div class="activity-head"><span class="a-icon">${a.icon||'🎯'}</span><span class="a-title">${a.title||''}</span></div>
            <p class="a-desc">${a.desc||''}</p>
            <div class="a-meta">
              ${a.duration && a.duration!=='—' ? `<span class="a-badge">⏱ ${a.duration}</span>` : ''}
              ${a.price && a.price!=='—' ? `<span class="a-badge">💰 ${a.price}</span>` : ''}
              ${a.season ? `<span class="a-badge">📅 ${a.season}</span>` : ''}
            </div>
          </div>`).join('')}</div></div>` : ''}
        <div class="row">
          <button type="button" class="focus-map-btn" data-id="${l.id}">🗺️ حدده على الخريطة</button>
          <a class="loc-link" target="_blank" rel="noopener" href="${l.gmaps || ('https://www.google.com/maps?q='+l.lat+','+l.lng)}">📍 فتح في خرائط جوجل</a>
        </div>
        <div class="row">
          <label class="check-label">
            <input type="checkbox" ${visited[l.id]?'checked':''} data-id="${l.id}"> تمت الزيارة
          </label>
          <span style="font-size:11px;color:var(--ink-soft);font-weight:700">اليوم ${l.day}</span>
        </div>
      </div>
    `;
    container.appendChild(wrap);
    cardRefs[l.id] = wrap;
    renderThumb(wrap.querySelector('.thumb'), l);
    wrap.querySelector('.focus-map-btn').addEventListener('click', ()=> focusMarker(l.id));
    if(hasActivities){
      const toggleActivities = ()=> wrap.classList.toggle('activities-open');
      wrap.querySelector('.act-chip').addEventListener('click', (e)=>{ e.stopPropagation(); toggleActivities(); });
      wrap.addEventListener('click', (e)=>{
        if(e.target.closest('a, button, input, .g-nav, .gallery, .check-label')) return;
        toggleActivities();
      });
    }
    wrap.querySelector('input[type=checkbox]').addEventListener('change', (e)=>{
      const id = e.target.dataset.id;
      if(e.target.checked) visited[id] = true; else delete visited[id];
      saveVisited();
      wrap.classList.toggle('visited', !!visited[id]);
      refreshMarkerIcon(id);
      updateProgress(city);
      updateHeaderStamps();
    });
  }
}

/* ================= PROGRESS ================= */
function updateProgress(city){
  const total = city.landmarks.length;
  const done = visitedCountOf(city);
  const pct = Math.round(done/total*100);
  const bar = document.getElementById('bar-'+city.id);
  const lbl = document.getElementById('lbl-'+city.id);
  if(bar) bar.style.width = pct+'%';
  if(lbl) lbl.textContent = `${done} من ${total} تم زيارتها (${pct}%)`;
  const tabBtn = tabsEl.querySelector(`.tab-btn[data-city="${city.id}"]`);
  if(tabBtn) tabBtn.style.setProperty('--p', pct);
}
function updateHeaderStamps(){
  document.getElementById('totalStamps').textContent = totalVisited();
  document.getElementById('totalCount').textContent = totalLandmarks();
}

/* ================= MAIN RENDER (build once, then toggle) ================= */
const renderedCities = new Set();

function updateSectionsActive(){
  CITIES.forEach(c=>{
    const sec = document.getElementById('sec-'+c.id);
    if(sec) sec.classList.toggle('active', c.id===activeCity);
  });
}

function activateCity(cityId, userInitiated){
  activeCity = cityId;
  buildTabs();
  updateSectionsActive();
  const city = CITIES.find(c=>c.id===cityId);
  if(!renderedCities.has(cityId)){
    ensureMap(city);
    renderCards(city);
    updateToggleButtons(cityId);
    renderedCities.add(cityId);
  }
  updateProgress(city);
  setTimeout(()=>{
    if(mapInstances[cityId]){
      mapInstances[cityId].invalidateSize();
      if(mapBounds[cityId]) mapInstances[cityId].fitBounds(mapBounds[cityId], {padding:[28,28]});
    }
  }, 80);
  if(userInitiated) scrollToActive();
}

function renderAll(){
  buildTabs();
  buildSections();
  CITIES.forEach(c=> updateProgress(c));
  updateHeaderStamps();
  activateCity(activeCity);
}

function buildTabs(){
  tabsEl.innerHTML = CITIES.map(c=>{
    const pct = Math.round(visitedCountOf(c)/c.landmarks.length*100);
    return `<button class="tab-btn ${c.id===activeCity?'active':''}" data-city="${c.id}" style="--p:${pct}">
      <span class="ring"></span> ${c.name} <span style="opacity:.65;font-weight:500">· ${c.days} ${c.days>1?'أيام':'يوم'}</span>
    </button>`;
  }).join('');
  tabsEl.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.city === activeCity) return;
      activateCity(btn.dataset.city, true);
    });
  });
};

renderAll();
</script>
</body>
</html>
